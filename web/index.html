<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat — Encrypted Real-Time Messenger</title>
    <meta name="description" content="End-to-end encrypted real-time chat application with AES-256-GCM encryption. Built with Java Socket, WebSocket, and modern web technologies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!--  Auth Screen                                                   -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <div class="auth-glass">
                <div class="auth-logo">
                    <div class="logo-icon">
                        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                            <rect width="48" height="48" rx="14" fill="url(#grad1)"/>
                            <path d="M24 14C18.48 14 14 18.48 14 24C14 29.52 18.48 34 24 34C29.52 34 34 29.52 34 24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                            <path d="M24 20V24L27 27" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="34" cy="14" r="4" fill="#4ade80"/>
                            <defs><linearGradient id="grad1" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
                        </svg>
                    </div>
                    <h1>SecureChat</h1>
                    <p class="auth-subtitle">🔒 End-to-End Encrypted Messenger</p>
                </div>

                <div class="auth-tabs">
                    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
                    <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
                </div>

                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="input-group">
                        <label for="auth-username">Username</label>
                        <input type="text" id="auth-username" placeholder="Enter username (3-20 chars)" minlength="3" maxlength="20" required autocomplete="username">
                    </div>
                    <div class="input-group">
                        <label for="auth-password">Password</label>
                        <input type="password" id="auth-password" placeholder="Enter password (min 4 chars)" minlength="4" required autocomplete="current-password">
                    </div>
                    <div id="auth-error" class="auth-error hidden"></div>
                    <button type="submit" class="btn-primary" id="auth-submit">
                        <span id="auth-btn-text">Login</span>
                        <div class="spinner hidden" id="auth-spinner"></div>
                    </button>
                </form>

                <div class="auth-footer">
                    <div class="security-badge">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1L2 4V7.33C2 11.13 4.56 14.66 8 15.5C11.44 14.66 14 11.13 14 7.33V4L8 1Z" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="1.2"/><path d="M6 8L7.5 9.5L10 6.5" stroke="#4ade80" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span>AES-256-GCM Encrypted</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════ -->
    <!--  Chat Screen                                                   -->
    <!-- ═══════════════════════════════════════════════════════════════ -->
    <div id="chat-screen" class="screen">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">
                    <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="14" fill="url(#grad2)"/>
                        <path d="M24 14C18.48 14 14 18.48 14 24C14 29.52 18.48 34 24 34C29.52 34 34 29.52 34 24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <defs><linearGradient id="grad2" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
                    </svg>
                    <span>SecureChat</span>
                </div>
                <button class="btn-icon" onclick="toggleSidebar()" title="Close sidebar">✕</button>
            </div>

            <div class="sidebar-section">
                <h3>Online Users</h3>
                <div id="user-list" class="user-list">
                    <div class="user-item skeleton"></div>
                    <div class="user-item skeleton"></div>
                </div>
            </div>

            <div class="sidebar-section">
                <h3>Quick Commands</h3>
                <div class="command-list">
                    <button class="cmd-btn" onclick="sendCommand('/list')">📋 User List</button>
                    <button class="cmd-btn" onclick="sendCommand('/stats')">📊 Statistics</button>
                    <button class="cmd-btn" onclick="sendCommand('/history')">📜 History</button>
                    <button class="cmd-btn" onclick="sendCommand('/help')">❓ Help</button>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar" id="user-avatar">?</div>
                    <div class="user-info">
                        <span class="username" id="display-username">—</span>
                        <span class="status-text">🔒 Encrypted</span>
                    </div>
                </div>
                <button class="btn-logout" onclick="disconnect()" title="Logout">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Top Bar -->
            <header class="chat-header">
                <div class="chat-header-left">
                    <button class="btn-icon menu-toggle" onclick="toggleSidebar()" title="Toggle sidebar">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <div class="channel-info">
                        <h2># general</h2>
                        <span class="channel-desc" id="online-count">Connecting...</span>
                    </div>
                </div>
                <div class="chat-header-right">
                    <div class="connection-status" id="connection-badge">
                        <div class="status-dot"></div>
                        <span>Connected</span>
                    </div>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages-container" id="messages-container">
                <div id="messages" class="messages">
                    <div class="welcome-message">
                        <div class="welcome-icon">💬</div>
                        <h3>Welcome to SecureChat</h3>
                        <p>All messages are end-to-end encrypted with AES-256-GCM</p>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <form id="chat-form" onsubmit="sendMessage(event)">
                    <div class="input-wrapper">
                        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" maxlength="2000">
                        <button type="submit" class="btn-send" id="btn-send" title="Send message">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                    <div class="input-footer">
                        <span class="encrypt-badge">🔒 AES-256-GCM</span>
                        <span class="char-count" id="char-count">0/2000</span>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
