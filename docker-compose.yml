# ═══════════════════════════════════════════════════════════════════
# SecureChat — Docker Compose Configuration
# ═══════════════════════════════════════════════════════════════════
#
# Start everything with:
#   docker-compose up -d
#
# Stop:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f
# ═══════════════════════════════════════════════════════════════════

version: '3.8'

services:
  securechat-server:
    build: .
    container_name: securechat
    ports:
      - "5000:5000"   # TCP Chat (terminal clients)
      - "5001:5001"   # WebSocket (web clients)
      - "5002:5002"   # HTTP (web UI)
    volumes:
      # Mount file cơ sở dữ liệu SQLite ra máy host để dữ liệu không bao giờ bị mất
      # ngay cả khi xóa container hay rebuild image mới
      - ./chat_server.db:/app/chat_server.db
    restart: unless-stopped
